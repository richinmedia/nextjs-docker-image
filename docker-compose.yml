services:
  web-app:
    build:
      context: .
      args:
        PORT: ${PORT:-3000}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
    restart: unless-stopped
    # The image already defines a HEALTHCHECK; `docker compose ps` reports it.
    # Uncomment to load runtime configuration from a file (never COPY it in):
    # env_file:
    #   - .env.production
